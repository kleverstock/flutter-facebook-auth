name: flutter_facebook_auth_web
description: web support for flutter_facebook_auth
version: 6.1.3
homepage: https://github.com/kleverstock/flutter-facebook-auth/tree/master/facebook_auth_web
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.19.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_facebook_auth_platform_interface:
    git:
      url: https://github.com/kleverstock/flutter-facebook-auth.git
      path: facebook_auth_platform_interface
      ref: deps/android-sdk-36
  web: ^1.0.0
  # flutter_facebook_auth_platform_interface:
  #   path: ../facebook_auth_platform_interface
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: FlutterFacebookAuthPlugin
        fileName: flutter_facebook_auth_web.dart
