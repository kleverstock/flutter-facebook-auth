name: facebook_auth_desktop
description: macOS support for flutter_facebook_auth
version: 2.1.2
homepage: https://github.com/kleverstock/flutter-facebook-auth/tree/master/facebook_auth_desktop
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.2"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^10.0.0
  flutter_facebook_auth_platform_interface:
    git:
      url: https://github.com/kleverstock/flutter-facebook-auth.git
      path: facebook_auth_platform_interface
      ref: deps/android-sdk-36

  # flutter_facebook_auth_platform_interface:
  #   path: ../facebook_auth_platform_interface
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: flutter_facebook_auth
    platforms:
      macos:
        pluginClass: FacebookAuthDesktopPlugin
        dartPluginClass: FacebookAuthDesktopPlugin